    <script>
      // Suppress Vite HMR WebSocket closing errors in AI Studio iframe environment
      window.addEventListener('error', function(e) {
        if (e && (e.message?.includes('WebSocket') || e.error?.message?.includes('WebSocket'))) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        if (e && (e.reason?.message?.includes('WebSocket') || String(e.reason).includes('WebSocket'))) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    </script>

  <body class="bg-amber-50 text-slate-900 antialiased selection:bg-yellow-300 selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
